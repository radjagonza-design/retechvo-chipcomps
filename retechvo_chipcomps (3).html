<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retechvo ChipComps</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe',
                            400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9',
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 10px 25px -5px rgba(139, 92, 246, 0.4)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #dbeafe; }
        .bar-animate { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-6 bg-gradient-to-br from-indigo-100 to-purple-200 text-slate-800">

    <div class="w-full max-w-[1400px] h-[95vh] bg-slate-50 rounded-[2rem] shadow-2xl flex overflow-hidden border-4 border-white/40">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-100 flex flex-col justify-between py-6 px-4 shrink-0 hidden md:flex z-20 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
            <div>
                <div class="flex items-center gap-3 px-2 mb-10">
                    <div class="w-9 h-9 bg-brand-500 rounded-xl flex items-center justify-center text-white shadow-glow shrink-0">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-slate-800 truncate">Retechvo <span class="font-light text-slate-500">ChipComps</span></span>
                </div>

                <p class="px-2 text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">Monitor</p>
                <nav class="space-y-1" id="sidebar-nav">
                    <button onclick="switchView('compare')" id="nav-compare" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-brand-500 text-white shadow-glow">
                        <i class="fa-solid fa-layer-group w-5 text-center"></i> Overview & Compare
                    </button>
                    <button onclick="switchView('leaderboard')" id="nav-leaderboard" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-500 hover:bg-brand-50 hover:text-brand-600">
                        <i class="fa-solid fa-ranking-star w-5 text-center"></i> Leaderboard
                    </button>
                    <button onclick="switchView('market')" id="nav-market" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-500 hover:bg-brand-50 hover:text-brand-600">
                        <i class="fa-solid fa-tags w-5 text-center"></i> Chipset Market Price
                    </button>
                </nav>
            </div>

            <div>
                <div class="bg-gradient-to-br from-brand-400 to-brand-600 rounded-2xl p-5 text-white mb-6 shadow-glow relative overflow-hidden">
                    <div class="absolute -right-4 -top-4 w-16 h-16 bg-white/20 rounded-full blur-2xl"></div>
                    <p class="text-xs text-white/80 font-medium mb-1 flex justify-between">
                        Benchmark Data <i class="fa-solid fa-database"></i>
                    </p>
                    <p class="text-xl font-bold mb-3">110+ <span class="text-sm font-normal text-white/80">CPUs</span></p>
                    <div class="w-full bg-black/20 rounded-full h-1.5 mb-2">
                        <div class="bg-white rounded-full h-1.5 w-[85%]"></div>
                    </div>
                    <div class="flex justify-between items-center text-[10px]">
                        <span>Database v3.0</span>
                        <a href="#" class="hover:underline flex items-center gap-1">Update <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>

                <div class="flex items-center gap-3 px-2">
                    <img src="https://placehold.co/100x100/e2e8f0/64748b?text=A" alt="Admin" class="w-10 h-10 rounded-full border-2 border-white shadow-sm shrink-0">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-semibold text-slate-800 truncate">Admin User</p>
                        <p class="text-xs text-slate-500 truncate">Workspace Lead</p>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical text-slate-400 cursor-pointer hover:text-slate-600"></i>
                </div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-full bg-[#f8fafc] relative overflow-hidden">
            
            <header class="flex justify-between items-center py-5 px-6 md:px-8 bg-white/60 backdrop-blur-md sticky top-0 z-10 border-b border-slate-100">
                <div>
                    <h1 id="page-title" class="text-2xl font-bold text-slate-800 tracking-tight">Overview</h1>
                    <p id="page-subtitle" class="text-xs text-slate-500 mt-1">Comparing high-performance computing agents</p>
                </div>
                <div class="flex items-center gap-4">
                    <button class="md:hidden bg-white border border-slate-200 text-slate-600 p-2 rounded-lg hover:bg-slate-50 shadow-sm transition-colors">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <button class="bg-brand-500 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-brand-600 shadow-sm shadow-brand-200 transition-colors flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> <span class="hidden sm:inline">Export</span>
                    </button>
                </div>
            </header>

            <div id="view-container" class="p-4 md:p-8 overflow-y-auto flex-1 space-y-6">
                <!-- Content injected by JS -->
            </div>
        </main>
    </div>

    <script>
        const cpuData = [];
        let idCounter = 1;

        // Enhanced Data Generator: MSRP in IDR
        const addCPU = (name, brand, single, multi, cores, threads, base, boost, tdp, status, msrpUSD, deprRate) => {
            
            // Rendering Time Formulas (Seconds)
            let rVideo = Math.round(6000000 / multi);
            let rAnim = Math.round(9000000 / multi);

            // Pricing Formulas - Converting USD to IDR (Asumsi 1 USD = Rp 15.500)
            let kurs = 15500;
            let msrpIDR = msrpUSD * kurs;
            let currentPriceIDR = Math.max(750000, Math.round(msrpIDR * (1 - deprRate))); // Minimum Rp 750.000

            cpuData.push({ 
                id: idCounter++, name, brand, single, multi, cores, threads, base, boost, tdp, status,
                render: { video: rVideo, anim: rAnim },
                price: { msrp: msrpIDR, current: currentPriceIDR, drop: Math.round(((msrpIDR - currentPriceIDR) / msrpIDR) * 100) }
            });
        };

        for (let gen = 14; gen >= 8; gen--) {
            let mult = (gen - 7);
            let ageDepr = (14 - gen) * 0.12; // 12% drop per generation older
            
            addCPU(`Intel Core i9-${gen}900K`, "Intel", 1500 + (mult * 250), 9000 + (mult * 4500), gen >= 13 ? 24 : (gen === 12 ? 16 : 10), gen >= 13 ? 32 : (gen === 12 ? 24 : 20), 3.0, parseFloat((4.5 + (mult * 0.1)).toFixed(1)), 125, "High End", 599, ageDepr);
            addCPU(`Intel Core i7-${gen}700K`, "Intel", 1400 + (mult * 200), 7000 + (mult * 3000), gen >= 13 ? 16 : (gen === 12 ? 12 : 8), gen >= 13 ? 24 : (gen === 12 ? 20 : 16), 3.2, parseFloat((4.3 + (mult * 0.1)).toFixed(1)), 125, "High End", 409, ageDepr);
            addCPU(`Intel Core i5-${gen}600K`, "Intel", 1300 + (mult * 180), 5000 + (mult * 2000), gen >= 13 ? 14 : (gen === 12 ? 10 : 6), gen >= 13 ? 20 : (gen === 12 ? 16 : 12), 3.5, parseFloat((4.0 + (mult * 0.1)).toFixed(1)), 125, "Mid Range", 319, ageDepr);
            addCPU(`Intel Core i3-${gen}100`, "Intel", 1000 + (mult * 150), 3000 + (mult * 1000), 4, 8, 3.3, parseFloat((3.8 + (mult * 0.1)).toFixed(1)), 60, "Entry Level", 139, ageDepr);
            addCPU(`Intel Core i7-${gen}700H`, "Intel", 1350 + (mult * 180), 6000 + (mult * 2500), gen >= 12 ? 14 : 8, gen >= 12 ? 20 : 16, 2.5, parseFloat((4.1 + (mult * 0.1)).toFixed(1)), 45, "High End", 450, ageDepr);
        }

        const amdSeries = [9, 8, 7, 6, 5, 4, 3, 2, 1];
        amdSeries.forEach((series, idx) => {
            let mult = series;
            let ageDepr = idx * 0.10; // 10% drop per generation older
            
            addCPU(`AMD Ryzen 9 ${series}950X`, "AMD", 1300 + (mult * 200), 9000 + (mult * 3000), 16, 32, 4.0, parseFloat((4.2 + (mult * 0.1)).toFixed(1)), 170, "High End", 699, ageDepr);
            addCPU(`AMD Ryzen 9 ${series}900X`, "AMD", 1250 + (mult * 180), 8000 + (mult * 2500), 12, 24, 4.2, parseFloat((4.1 + (mult * 0.1)).toFixed(1)), 120, "High End", 549, ageDepr);
            addCPU(`AMD Ryzen 7 ${series}700X`, "AMD", 1200 + (mult * 150), 6000 + (mult * 2000), 8, 16, 4.5, parseFloat((4.0 + (mult * 0.1)).toFixed(1)), 105, "Mid Range", 399, ageDepr);
            addCPU(`AMD Ryzen 5 ${series}600X`, "AMD", 1100 + (mult * 120), 4500 + (mult * 1200), 6, 12, 3.8, parseFloat((3.9 + (mult * 0.1)).toFixed(1)), 65, "Mid Range", 299, ageDepr);
        });

        const appleGens = [1, 2, 3, 4];
        appleGens.forEach(gen => {
            let mult = gen;
            let ageDepr = (4 - gen) * 0.15; // 15% drop per gen older
            
            addCPU(`Apple M${gen}`, "Apple", 2200 + (mult * 200), 7500 + (mult * 1200), 8, 8, parseFloat((3.0 + (mult * 0.1)).toFixed(1)), parseFloat((3.0 + (mult * 0.1)).toFixed(1)), 20, "Efficient", 999, ageDepr);
            addCPU(`Apple M${gen} Pro`, "Apple", 2300 + (mult * 220), 11000 + (mult * 2000), 12, 12, parseFloat((3.2 + (mult * 0.1)).toFixed(1)), parseFloat((3.2 + (mult * 0.1)).toFixed(1)), 30, "Efficient", 1999, ageDepr);
            addCPU(`Apple M${gen} Max`, "Apple", 2400 + (mult * 240), 16000 + (mult * 3000), 16, 16, parseFloat((3.4 + (mult * 0.1)).toFixed(1)), parseFloat((3.4 + (mult * 0.1)).toFixed(1)), 78, "High End", 2999, ageDepr);
            if(gen < 4) addCPU(`Apple M${gen} Ultra`, "Apple", 2450 + (mult * 260), 28000 + (mult * 5000), 24, 24, parseFloat((3.4 + (mult * 0.1)).toFixed(1)), parseFloat((3.4 + (mult * 0.1)).toFixed(1)), 150, "High End", 3999, ageDepr);
        });

        addCPU("AMD Ryzen Threadripper PRO 7995WX", "AMD", 2850, 98000, 96, 192, 2.5, 5.1, 350, "High End", 9999, 0.05);
        addCPU("Intel Xeon W9-3495X", "Intel", 2100, 75000, 56, 112, 1.9, 4.8, 350, "High End", 5889, 0.10);

        cpuData.sort((a, b) => b.multi - a.multi);
        let selectedCpu1Id = cpuData.length > 0 ? cpuData[0].id : null;
        let selectedCpu2Id = cpuData.length > 1 ? cpuData[1].id : null;

        const MAX_VALS = { 
            single: Math.max(...cpuData.map(c => c.single)) * 1.05, 
            multi: Math.max(...cpuData.map(c => c.multi)) * 1.05, 
            cores: Math.max(...cpuData.map(c => c.cores)), 
            tdp: Math.max(...cpuData.map(c => c.tdp)),
            rVideo: Math.max(...cpuData.map(c => c.render.video)), 
            rAnim: Math.max(...cpuData.map(c => c.render.anim))
        };

        const avgSingle = Math.round(cpuData.reduce((acc, curr) => acc + curr.single, 0) / cpuData.length);
        const avgMulti = Math.round(cpuData.reduce((acc, curr) => acc + curr.multi, 0) / cpuData.length);
        
        // Format angka dengan pemisah ribuan ala Indonesia (titik)
        const fmt = (num) => new Intl.NumberFormat('id-ID').format(num);

        const renderBadge = (status) => {
            if(status === 'High End') return `<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1.5 w-fit"><span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>${status}</span>`;
            if(status === 'Efficient') return `<span class="bg-blue-100 text-blue-700 px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1.5 w-fit"><span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>${status}</span>`;
            return `<span class="bg-yellow-100 text-yellow-700 px-2.5 py-1 rounded-md text-[11px] font-semibold flex items-center gap-1.5 w-fit"><span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>${status}</span>`;
        };

        const renderBrandBadge = (brand) => {
            if(brand === 'Intel') return `<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold shrink-0">INTEL</span>`;
            if(brand === 'AMD') return `<span class="bg-red-50 text-red-600 px-2 py-0.5 rounded text-[10px] font-bold shrink-0">AMD</span>`;
            return `<span class="bg-slate-800 text-slate-100 px-2 py-0.5 rounded text-[10px] font-bold shrink-0">APPLE</span>`;
        };

        const switchView = (view) => {
            const navs = ['compare', 'leaderboard', 'market'];
            navs.forEach(n => {
                document.getElementById(`nav-${n}`).className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-slate-500 hover:bg-brand-50 hover:text-brand-600";
            });
            
            const activeBtn = document.getElementById(`nav-${view}`);
            activeBtn.className = "w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-brand-500 text-white shadow-glow";
            
            const pageTitle = document.getElementById('page-title');
            const pageSub = document.getElementById('page-subtitle');

            if(view === 'compare') {
                pageTitle.innerText = "Overview";
                pageSub.innerText = "Monitoring computing benchmarks and agents.";
                renderCompareView();
            } else if (view === 'leaderboard') {
                pageTitle.innerText = "Global Leaderboard";
                pageSub.innerText = "Live rankings of top CPU architectures.";
                renderLeaderboardView();
            } else if (view === 'market') {
                pageTitle.innerText = "Chipset Market Tracker";
                pageSub.innerText = "Live MSRP and current estimated retail prices in IDR.";
                renderMarketPriceView();
            }
        };

        const renderCompareView = () => {
            const container = document.getElementById('view-container');
            
            container.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-2">
                    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-soft border border-slate-100">
                        <p class="text-xs md:text-sm text-slate-500 font-medium flex justify-between">Total Models <i class="fa-solid fa-microchip text-slate-300"></i></p>
                        <p class="text-2xl md:text-3xl font-bold text-slate-800 mt-2">${cpuData.length}</p>
                        <p class="text-[10px] md:text-xs text-green-500 mt-2 font-medium flex items-center gap-1"><i class="fa-solid fa-arrow-trend-up"></i> Updated Database</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-soft border border-slate-100">
                        <p class="text-xs md:text-sm text-slate-500 font-medium flex justify-between">Avg Single-Core <i class="fa-solid fa-bolt text-slate-300"></i></p>
                        <p class="text-2xl md:text-3xl font-bold text-slate-800 mt-2">${fmt(avgSingle)}</p>
                        <p class="text-[10px] md:text-xs text-slate-400 mt-2 font-medium flex items-center gap-1">Synthetic synthetic metric</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-soft border border-slate-100">
                        <p class="text-xs md:text-sm text-slate-500 font-medium flex justify-between">Avg Multi-Core <i class="fa-solid fa-layer-group text-slate-300"></i></p>
                        <p class="text-2xl md:text-3xl font-bold text-slate-800 mt-2">${fmt(avgMulti)}</p>
                        <p class="text-[10px] md:text-xs text-brand-500 mt-2 font-medium flex items-center gap-1"><i class="fa-solid fa-chart-line"></i> Intensive load average</p>
                    </div>
                    <div class="bg-white rounded-2xl p-4 md:p-5 shadow-soft border border-slate-100">
                        <p class="text-xs md:text-sm text-slate-500 font-medium flex justify-between">System Health <i class="fa-solid fa-heart-pulse text-slate-300"></i></p>
                        <div class="mt-2 flex items-center gap-4">
                            <div class="relative w-10 h-10 md:w-12 md:h-12 flex items-center justify-center">
                                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                    <path class="text-slate-100" stroke-width="4" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                    <path class="text-brand-500" stroke-width="4" stroke-dasharray="98, 100" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                </svg>
                                <span class="absolute text-[9px] md:text-[10px] font-bold text-slate-700">98%</span>
                            </div>
                            <div class="text-[10px] md:text-xs text-slate-500">Optimal temp<br><span class="text-slate-800 font-medium">Stable</span></div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-soft border border-slate-100 p-4 md:p-6 overflow-visible">
                    <div class="flex flex-col md:flex-row justify-between md:items-center mb-6 gap-4">
                        <h2 class="text-lg font-bold text-slate-800">Head-to-Head Comparison</h2>
                        <div class="flex flex-col sm:flex-row gap-3 items-center w-full md:w-auto">
                            
                            <div class="relative w-full sm:w-56 lg:w-64" id="dropdown-container-1">
                                <div class="relative">
                                    <input type="text" id="cpu-search-1" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-lg pl-3 pr-8 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-700 font-medium outline-none transition-all shadow-sm cursor-text placeholder-slate-400" placeholder="Search CPU 1..." autocomplete="off">
                                    <i class="fa-solid fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-[11px] pointer-events-none"></i>
                                </div>
                                <ul id="cpu-list-1" class="absolute z-50 w-full mt-1.5 bg-white border border-slate-100 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden divide-y divide-slate-50 ring-1 ring-slate-900/5"></ul>
                            </div>
                            
                            <span class="flex items-center text-slate-300 text-sm italic font-bold">VS</span>
                            
                            <div class="relative w-full sm:w-56 lg:w-64" id="dropdown-container-2">
                                <div class="relative">
                                    <input type="text" id="cpu-search-2" class="w-full bg-slate-50 border border-slate-200 text-sm rounded-lg pl-3 pr-8 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 text-slate-700 font-medium outline-none transition-all shadow-sm cursor-text placeholder-slate-400" placeholder="Search CPU 2..." autocomplete="off">
                                    <i class="fa-solid fa-search absolute right-3 top-1/2 transform -translate-y-1/2 text-slate-400 text-[11px] pointer-events-none"></i>
                                </div>
                                <ul id="cpu-list-2" class="absolute z-50 w-full mt-1.5 bg-white border border-slate-100 rounded-lg shadow-xl max-h-60 overflow-y-auto hidden divide-y divide-slate-50 ring-1 ring-slate-900/5"></ul>
                            </div>
                        </div>
                    </div>
                    
                    <div id="compare-results" class="space-y-4 mt-4"></div>
                </div>
            `;

            setupDropdown(1);
            setupDropdown(2);
            drawComparisonBars();
        };

        const setupDropdown = (num) => {
            const input = document.getElementById(`cpu-search-${num}`);
            const list = document.getElementById(`cpu-list-${num}`);
            const dropdownContainer = document.getElementById(`dropdown-container-${num}`);
            
            const initialCpu = cpuData.find(c => c.id === (num === 1 ? selectedCpu1Id : selectedCpu2Id));
            if(initialCpu) input.value = initialCpu.name;

            const renderList = (filterText = "") => {
                const filtered = cpuData.filter(c => c.name.toLowerCase().includes(filterText.toLowerCase()));
                list.innerHTML = filtered.map(c => `
                    <li class="px-3 py-2.5 hover:bg-brand-50 cursor-pointer text-[13px] text-slate-700 transition-colors flex justify-between items-center group" data-id="${c.id}">
                        <span class="truncate pr-2 group-hover:text-brand-700 font-medium">${c.name}</span>
                        ${renderBrandBadge(c.brand)}
                    </li>
                `).join('');
                
                if(filtered.length === 0) list.innerHTML = `<li class="px-4 py-4 text-xs text-slate-400 text-center">No CPU results found</li>`;

                list.querySelectorAll('li[data-id]').forEach(li => {
                    li.addEventListener('click', (e) => {
                        e.stopPropagation(); 
                        const id = parseInt(li.getAttribute('data-id'));
                        if(num === 1) selectedCpu1Id = id; else selectedCpu2Id = id;
                        input.value = cpuData.find(c => c.id === id).name;
                        list.classList.add('hidden');
                        drawComparisonBars();
                    });
                });
            };

            input.addEventListener('focus', () => { input.select(); renderList(""); list.classList.remove('hidden'); });
            input.addEventListener('input', (e) => { list.classList.remove('hidden'); renderList(e.target.value); });
            document.addEventListener('click', (e) => {
                if (dropdownContainer && !dropdownContainer.contains(e.target)) {
                    list.classList.add('hidden');
                    const currentCpu = cpuData.find(c => c.id === (num === 1 ? selectedCpu1Id : selectedCpu2Id));
                    if(currentCpu && input.value !== currentCpu.name) input.value = currentCpu.name;
                }
            });
        };

        const drawComparisonBars = () => {
            const c1 = cpuData.find(c => c.id === selectedCpu1Id);
            const c2 = cpuData.find(c => c.id === selectedCpu2Id);
            const area = document.getElementById('compare-results');
            if(!c1 || !c2 || !area) return;

            const makeGroupHeader = (title, icon) => `
                <div class="mt-8 mb-5 border-b border-slate-100 pb-2 flex items-center gap-2">
                    <div class="w-6 h-6 rounded bg-brand-50 flex items-center justify-center text-brand-500"><i class="${icon} text-xs"></i></div>
                    <h3 class="text-xs md:text-sm font-bold text-slate-800 uppercase tracking-widest">${title}</h3>
                </div>
            `;
            
            const makeMetric = (label, val1, val2, max, unit="", reverseColor=false) => {
                let p1 = Math.min((val1 / max) * 100, 100);
                let p2 = Math.min((val2 / max) * 100, 100);
                let w1 = reverseColor ? val1 <= val2 : val1 >= val2;
                
                let color1 = w1 ? 'bg-brand-500' : 'bg-brand-200';
                let color2 = !w1 ? 'bg-indigo-600' : 'bg-indigo-200';

                return `
                <div class="mb-5">
                    <div class="flex justify-between items-end mb-2">
                        <span class="text-[10px] md:text-xs font-semibold text-slate-700 w-1/4 truncate pr-2">${c1.name}</span>
                        <span class="text-[10px] md:text-[11px] font-bold text-slate-400 uppercase tracking-widest text-center w-2/4">${label}</span>
                        <span class="text-[10px] md:text-xs font-semibold text-slate-700 w-1/4 text-right truncate pl-2">${c2.name}</span>
                    </div>
                    <div class="flex items-center gap-2 md:gap-3 mb-1.5">
                        <span class="text-xs md:text-sm font-bold w-12 md:w-16 text-right text-slate-800 shrink-0">${fmt(val1)}${unit}</span>
                        <div class="flex-1 h-2.5 md:h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div class="${color1} h-full rounded-full bar-animate shadow-sm" style="width: 0%" data-width="${p1}%"></div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 md:gap-3">
                        <span class="text-xs md:text-sm font-bold w-12 md:w-16 text-right text-slate-800 shrink-0">${fmt(val2)}${unit}</span>
                        <div class="flex-1 h-2.5 md:h-3 bg-slate-100 rounded-full overflow-hidden">
                            <div class="${color2} h-full rounded-full bar-animate shadow-sm" style="width: 0%" data-width="${p2}%"></div>
                        </div>
                    </div>
                </div>`;
            };

            area.innerHTML = `
                ${makeGroupHeader('Synthetic Benchmarks & Specs', 'fa-solid fa-microchip')}
                ${makeMetric('Single-Core Score', c1.single, c2.single, MAX_VALS.single)}
                ${makeMetric('Multi-Core Score', c1.multi, c2.multi, MAX_VALS.multi)}
                ${makeMetric('Core Count', c1.cores, c2.cores, MAX_VALS.cores)}

                ${makeGroupHeader('Productivity & Rendering (Lower is Better)', 'fa-solid fa-video')}
                ${makeMetric('4K 60fps Video Render', c1.render.video, c2.render.video, MAX_VALS.rVideo, 's', true)}
                ${makeMetric('3D Animation Render', c1.render.anim, c2.render.anim, MAX_VALS.rAnim, 's', true)}
                
                ${makeGroupHeader('Power Draw (Lower is Better)', 'fa-solid fa-bolt')}
                ${makeMetric('TDP (Thermal Power)', c1.tdp, c2.tdp, MAX_VALS.tdp, 'W', true)}
            `;

            setTimeout(() => {
                area.querySelectorAll('.bar-animate').forEach(bar => bar.style.width = bar.getAttribute('data-width'));
            }, 50);
        };

        const renderLeaderboardView = () => {
            const container = document.getElementById('view-container');
            
            let tbodyHtml = [...cpuData].sort((a,b) => b.multi - a.multi).map((c, i) => `
                <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
                    <td class="py-4 px-4 text-sm font-medium text-slate-800 flex items-center gap-3 min-w-[200px]">
                        <div class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center text-xs font-bold text-slate-500 group-hover:bg-brand-100 group-hover:text-brand-600 transition-colors">${i+1}</div>
                        ${c.name}
                    </td>
                    <td class="py-4 px-4 min-w-[120px]">${renderBadge(c.status)}</td>
                    <td class="py-4 px-4 text-sm font-semibold text-slate-600 whitespace-nowrap">${c.cores}C / ${c.threads}T</td>
                    <td class="py-4 px-4 text-sm font-semibold text-slate-800 text-right">${c.render.video}s</td>
                    <td class="py-4 px-4 text-sm font-bold text-brand-600 text-right">${fmt(c.multi)}</td>
                </tr>
            `).join('');

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-soft border border-slate-100 overflow-hidden flex flex-col h-full">
                    <div class="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-white z-10 sticky top-0">
                        <h2 class="text-lg font-bold text-slate-800">Global Hierarchy</h2>
                    </div>
                    <div class="overflow-x-auto p-2 pb-10">
                        <table class="w-full text-left border-collapse min-w-[800px]">
                            <thead>
                                <tr>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Model Name</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Class</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Cores / Threads</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400 text-right">4K Render</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-brand-500 text-right">Multi-Core</th>
                                </tr>
                            </thead>
                            <tbody>${tbodyHtml}</tbody>
                        </table>
                    </div>
                </div>
            `;
        };

        const renderMarketPriceView = () => {
            const container = document.getElementById('view-container');
            
            // Calculate absolute minimum and maximum current prices dynamically
            const allPrices = cpuData.map(c => c.price.current);
            const absMinPrice = Math.min(...allPrices);
            const absMaxPrice = Math.max(...allPrices);
            
            let currentMinPrice = absMinPrice;
            let currentMaxPrice = absMaxPrice;

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-soft border border-slate-100 overflow-hidden flex flex-col h-full">
                    <div class="p-4 md:p-6 border-b border-slate-100 flex justify-between items-center bg-white z-10 sticky top-0">
                        <h2 class="text-lg font-bold text-slate-800">Current Market Valuation</h2>
                        <div class="text-sm font-medium text-brand-500 flex items-center gap-2"><i class="fa-solid fa-filter"></i> <span class="hidden sm:inline">Price Filter</span></div>
                    </div>
                    
                    <!-- Filter UI Section -->
                    <div class="p-4 md:px-6 bg-slate-50 border-b border-slate-100 flex flex-col sm:flex-row gap-6 items-center">
                        <div class="flex-1 w-full">
                            <label class="text-xs font-bold text-slate-500 mb-2 flex justify-between">
                                Min Price: <span id="min-val-disp" class="text-brand-600 font-bold">Rp ${fmt(currentMinPrice)}</span>
                            </label>
                            <input type="range" id="min-price-slider" min="${absMinPrice}" max="${absMaxPrice}" step="100000" value="${currentMinPrice}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-500">
                        </div>
                        <div class="flex-1 w-full">
                            <label class="text-xs font-bold text-slate-500 mb-2 flex justify-between">
                                Max Price: <span id="max-val-disp" class="text-brand-600 font-bold">Rp ${fmt(currentMaxPrice)}</span>
                            </label>
                            <input type="range" id="max-price-slider" min="${absMinPrice}" max="${absMaxPrice}" step="100000" value="${currentMaxPrice}" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-500">
                        </div>
                    </div>

                    <div class="overflow-x-auto p-2 pb-10">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Brand</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Model Name</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400">Launch Price (MSRP)</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-brand-500">Est. Retail Price</th>
                                    <th class="py-3 px-4 text-[10px] font-bold uppercase tracking-wider text-slate-400 text-right">Value Drop</th>
                                </tr>
                            </thead>
                            <tbody id="market-tbody"></tbody>
                        </table>
                    </div>
                </div>
            `;

            const updateTable = () => {
                const tbody = document.getElementById('market-tbody');
                if(!tbody) return;
                
                let filteredData = cpuData.filter(c => c.price.current >= currentMinPrice && c.price.current <= currentMaxPrice);
                
                let tbodyHtml = filteredData.sort((a,b) => b.price.current - a.price.current).map((c) => {
                    let dropBadgeStyle = "bg-slate-100 text-slate-600";
                    if (c.price.drop > 40) dropBadgeStyle = "bg-red-100 text-red-600";
                    else if (c.price.drop > 15) dropBadgeStyle = "bg-orange-100 text-orange-600";
                    else if (c.price.drop > 0) dropBadgeStyle = "bg-emerald-100 text-emerald-600";
                    
                    return `
                    <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
                        <td class="py-4 px-4">${renderBrandBadge(c.brand)}</td>
                        <td class="py-4 px-4 text-sm font-bold text-slate-800 min-w-[200px]">${c.name}</td>
                        <td class="py-4 px-4 text-sm font-semibold text-slate-400 line-through decoration-slate-300">Rp ${fmt(c.price.msrp)}</td>
                        <td class="py-4 px-4 text-sm font-bold text-brand-600">Rp ${fmt(c.price.current)}</td>
                        <td class="py-4 px-4 text-right">
                            <span class="${dropBadgeStyle} px-2.5 py-1 rounded text-xs font-bold inline-flex items-center gap-1">
                                ${c.price.drop > 0 ? '<i class="fa-solid fa-arrow-trend-down"></i> -' : ''}${c.price.drop}%
                            </span>
                        </td>
                    </tr>
                    `;
                }).join('');

                if (filteredData.length === 0) {
                    tbodyHtml = `<tr><td colspan="5" class="py-12 text-center text-slate-400 text-sm font-medium"><i class="fa-solid fa-ghost text-2xl mb-3 block text-slate-300"></i>No CPUs found in this price range.</td></tr>`;
                }

                tbody.innerHTML = tbodyHtml;
            };

            // Render table for the first time
            updateTable();

            const minSlider = document.getElementById('min-price-slider');
            const maxSlider = document.getElementById('max-price-slider');
            const minDisp = document.getElementById('min-val-disp');
            const maxDisp = document.getElementById('max-val-disp');

            minSlider.addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                // Prevent min slider from exceeding max slider
                if (val > currentMaxPrice) {
                    val = currentMaxPrice;
                    minSlider.value = val;
                }
                currentMinPrice = val;
                minDisp.innerText = `Rp ${fmt(val)}`;
                updateTable();
            });

            maxSlider.addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                // Prevent max slider from going below min slider
                if (val < currentMinPrice) {
                    val = currentMinPrice;
                    maxSlider.value = val;
                }
                currentMaxPrice = val;
                maxDisp.innerText = `Rp ${fmt(val)}`;
                updateTable();
            });
        };

        window.onload = () => {
            switchView('compare'); // Default View
        };
    </script>
</body>
</html>
